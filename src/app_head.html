<title>SY Spec Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#22262A; --ground:#F6F4F1; --surface:#FFFFFF; --surface-2:#FBFAF8;
  --accent:#E8850C; --accent-soft:#FDF1E0; --rule:#DCD8D2; --rule-soft:#EBE7E2;
  --muted:#71767A; --shadow:rgba(30,26,20,.10);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:"Archivo","IBM Plex Sans",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E9E6E2; --ground:#15181A; --surface:#1C2023; --surface-2:#21262A;
  --accent:#F5A03A; --accent-soft:#2C2318; --rule:#343B40; --rule-soft:#2A3034;
  --muted:#8F9599; --shadow:rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --ink:#E9E6E2; --ground:#15181A; --surface:#1C2023; --surface-2:#21262A;
  --accent:#F5A03A; --accent-soft:#2C2318; --rule:#343B40; --rule-soft:#2A3034;
  --muted:#8F9599; --shadow:rgba(0,0,0,.4);}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:38px;width:auto}
img.lg-l{display:block}
img.lg-d{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) img.lg-l{display:none}
  :root:not([data-theme="light"]) img.lg-d{display:block}}
:root[data-theme="dark"] img.lg-l{display:none}
:root[data-theme="dark"] img.lg-d{display:block}
.brand em{font-style:normal;font-size:10.5px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.1em;padding-left:11px;border-left:1px solid var(--rule)}
.spacer{flex:1}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:20px;padding:3px 12px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:7px 14px;cursor:pointer;
  font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* chooser */
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(20,18,15,.55);display:flex;align-items:center;
  justify-content:center;padding:24px;backdrop-filter:blur(3px)}
.dialog{background:var(--surface);border-radius:12px;max-width:880px;width:100%;max-height:92vh;overflow:auto;
  box-shadow:0 20px 60px var(--shadow);padding:34px 36px 30px;position:relative}
.dialog img.dl{height:52px;margin-bottom:16px}
.dialog h1{font-family:var(--disp);font-size:26px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em}
.dialog p.sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:11px}
.tile{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:15px 16px;
  border:1px solid var(--rule);border-radius:9px;background:var(--surface-2);cursor:pointer}
.tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.tile .tn{font-family:var(--disp);font-weight:600;font-size:14.5px}
.tile .td{font-size:11.5px;color:var(--muted);line-height:1.35}
.tile .tr{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent);margin-top:6px}
.tile.soon{opacity:.5;cursor:not-allowed}
.tile.soon:hover{border-color:var(--rule);background:var(--surface-2)}
.tile.soon .tr{color:var(--muted)}
.closeX{position:absolute;top:16px;right:18px;border:0;background:none;font-size:22px;color:var(--muted);
  cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}
.closeX:hover{color:var(--accent);background:var(--surface-2)}

/* layout */
.wrap{display:grid;grid-template-columns:246px minmax(0,1fr) minmax(0,470px);align-items:start}
@media(max-width:1240px){.wrap{grid-template-columns:246px minmax(0,1fr)}
  .viewer{display:none}body.showprev .viewer{display:block;grid-column:1/-1;border-left:0;border-top:1px solid var(--rule)}}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.rail{display:none}}

.rail{border-right:1px solid var(--rule);background:var(--surface);min-height:calc(100vh - 53px);
  position:sticky;top:53px;max-height:calc(100vh - 53px);overflow:auto;padding:14px 0 24px}
.raillabel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);
  padding:0 18px 9px}
.step{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:8px 18px;cursor:pointer;border-left:2.5px solid transparent}
.step:hover{background:var(--surface-2)}
.step.cur{background:var(--accent-soft);border-left-color:var(--accent)}
.step .sn{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none}
.step.cur .sn{color:var(--accent);font-weight:600}
.step .st{flex:1;font-size:12.5px;line-height:1.3}
.step.cur .st{font-weight:600}
.step .sc{font-family:var(--mono);font-size:10px;color:var(--muted);flex:none;
  border:1px solid var(--rule);border-radius:10px;padding:1px 6px}
.step .sc.has{color:var(--accent);border-color:var(--accent)}
.jobsWrap{border-top:1px solid var(--rule-soft);margin-top:14px;padding:14px 18px 0}
.job{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;
  font-size:12px;background:var(--surface-2);margin-bottom:5px}
.job b{font-family:var(--mono);font-size:11px;color:var(--accent)}
.job .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job button{background:none;border:0;cursor:pointer;font-size:11px;color:var(--muted);padding:2px 4px}
.job button:hover{color:var(--accent)}

.stage{padding:26px 32px 40px;min-width:0}
.stagehead{margin-bottom:20px}
.crumb{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.stagehead h2{font-family:var(--disp);font-size:25px;font-weight:700;margin:0 0 6px;letter-spacing:-.015em;text-wrap:balance}
.lede{color:var(--muted);font-size:13px;margin:0;max-width:62ch}
.grouplabel{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  margin:24px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--rule-soft)}
.card{border:1px solid var(--rule);border-radius:9px;background:var(--surface);padding:13px 15px;margin-bottom:9px}
.card.on{border-color:var(--accent);background:var(--accent-soft)}
.cardhead{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap}
.cardhead input{accent-color:var(--accent);width:16px;height:16px;flex:none;margin:0}
.tag{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--surface);
  border:1px solid var(--accent);border-radius:4px;padding:1px 6px;flex:none}
.tag.off{visibility:hidden}
.ct{font-family:var(--disp);font-weight:600;font-size:13.5px;flex:1;min-width:150px}
.cu{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tgt{color:var(--accent);font-weight:600;font-size:12px;margin:9px 0 4px}
.text{font-size:12.5px;color:var(--ink);margin-top:7px}
.text p{margin:0 0 6px;max-width:70ch}
.text p.nt,.paper p.nt{color:var(--muted);font-size:11.5px;border-left:2px solid var(--accent);padding-left:9px}
.text.clip{max-height:56px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);
  mask-image:linear-gradient(#000 55%,transparent)}
.more{background:none;border:0;color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 0}
.more:hover{text-decoration:underline}
.projcard h3{font-family:var(--disp);font-size:14px;margin:0 0 12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.fields label.wide{grid-column:1/-1}
.fields input{border:1px solid var(--rule);background:var(--surface-2);border-radius:6px;padding:7px 9px;
  font-size:13px;text-transform:none;letter-spacing:0}
.fields input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.navbar{display:flex;align-items:center;gap:16px;margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)}
.prog{flex:1;height:4px;background:var(--rule-soft);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent)}

.viewer{padding:22px 26px 60px;border-left:1px solid var(--rule);min-width:0;
  position:sticky;top:53px;max-height:calc(100vh - 53px);overflow:auto}
.paper{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:32px 34px 40px;
  box-shadow:0 1px 3px var(--shadow)}
.plogo{height:60px;width:auto;margin:0 0 4px}
.paddr{font-size:10px;color:var(--muted);margin:3px 0 0;padding-bottom:10px;border-bottom:2.5px solid var(--accent)}
.ptitle{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.06;margin:20px 0 0;text-wrap:balance}
.ptitle .o{color:var(--accent);display:block}
.psub{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:7px 0 16px}
table.meta{border-collapse:collapse;width:100%;margin-bottom:8px}
table.meta td{border:1px solid var(--rule);padding:4px 7px;font-size:10.5px}
table.meta td:first-child{background:var(--surface-2);font-weight:600;width:36%;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sched{border-collapse:collapse;width:100%;margin:6px 0 10px}
.sched th{background:var(--surface-2);text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;
  padding:5px 7px;border:1px solid var(--rule);color:var(--muted)}
.sched td{border:1px solid var(--rule);padding:4px 7px;font-size:10.5px}
.sched td.r{font-family:var(--mono);font-weight:600;color:var(--accent);width:46px}
.sched td.u{font-family:var(--mono);font-variant-numeric:tabular-nums;width:86px}
.sec{font-family:var(--disp);font-size:13px;font-weight:700;margin:24px 0 4px;padding-bottom:4px;
  border-bottom:2px solid var(--accent);display:flex;gap:9px;align-items:baseline}
.sec i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:600}
.glab{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 0 0}
.eh{display:flex;gap:9px;align-items:baseline;margin:14px 0 3px;padding-bottom:3px;border-bottom:1px solid var(--rule-soft)}
.eh .tag2{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--accent)}
.eh h4{margin:0;font-family:var(--disp);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tl{color:var(--accent);font-weight:600;font-size:10.5px;margin:5px 0 3px}
.paper p{font-size:10.5px;margin:0 0 5px}
.empty{color:var(--muted);font-style:italic}
.flag{border-left:2.5px solid var(--accent);background:var(--accent-soft);padding:8px 11px;margin:12px 0;
  font-size:10px;border-radius:0 5px 5px 0}
.flag b{color:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);
  padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 4px 16px var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* configurator */
.cfgcard{border-color:var(--accent);background:var(--surface)}
.cfghead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.cfghead h3{font-family:var(--disp);font-size:15px;margin:0}
.uval{font-family:var(--mono);font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid}
.uval b{font-size:19px}
.uval small{color:var(--muted);font-size:10.5px}
.uval.ok{color:#2F7355;border-color:#2F7355;background:rgba(47,115,85,.08)}
.uval.bad{color:#B4541E;border-color:#B4541E;background:rgba(180,84,30,.08)}
.cfggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px 12px}
.cf{display:flex;flex-direction:column;gap:3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.cf select{border:1px solid var(--rule);background:var(--surface-2);border-radius:6px;padding:6px 8px;font-size:12.5px;
  text-transform:none;letter-spacing:0;color:var(--ink);max-width:100%}
.cf select:focus{border-color:var(--accent);outline:none}
.cfgwarn{color:#B4541E;font-size:12px;margin:10px 0 0;font-weight:500}
.working{margin-top:12px;font-size:12px}
.working summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12px}
table.wk{border-collapse:collapse;width:100%;margin-top:8px;font-size:11.5px}
table.wk th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--rule);padding:4px 6px}
table.wk td{padding:3px 6px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
table.wk td:nth-child(2),table.wk td:nth-child(3){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.wk td i{color:var(--muted);font-size:10.5px}
table.wk tr.tot td{border-top:1px solid var(--rule);font-weight:600}
.cfgfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.srcnote{font-size:10.5px;color:var(--muted);max-width:60ch}
.rm{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:5px;font-size:11px;color:var(--muted);padding:2px 8px;cursor:pointer}
.rm:hover{color:#B4541E;border-color:#B4541E}
.paper table.wk td,.paper table.wk th{font-size:9.5px}
</style>
