<title>Specline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---------- tokens: light is the base; dark redefines the same names ---------- */
:root{
  /* Specline identity — see src/tokens.css and the identity sheet.
     Warm detail paper against cool drafting ink, one petrol signal.
     Names are historic; values are the brand. */
  --paper:#F4F3F0; --paper2:#EAE8E2; --surface:#FBFAF8;
  --ink:#10191F; --ink2:#3C4A54; --ink3:#6B7A85;
  --line:#DAD7D0; --line2:#BCB8AF;
  --accent:#0E6E85; --accent-ink:#0B586B; --accent-soft:#E0EEF2; --on-accent:#FBFAF8;
  --ok:#2E7D4F; --ok-soft:#E3F0E8; --warn:#B3352B; --warn-soft:#F8E8E6;
  --hold:#8A6108; --hold-soft:#F6EEDB;
  --shadow:0 1px 2px rgba(16,25,31,.06);
  --shadow-lg:0 4px 14px rgba(16,25,31,.10),0 24px 60px rgba(16,25,31,.12);
  --disp:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-input:2px; --r-ctl:4px; --r-card:6px; --r-modal:10px;
  --wordmark:"Archivo","IBM Plex Sans",Inter,system-ui,sans-serif;
  --brand-ink:#16281F; --bracket:#0E6E85;
  --logo-plate:transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10191F; --paper2:#0B1319; --surface:#17222A;
  --ink:#EDEAE4; --ink2:#A8B4BC; --ink3:#78868F;
  --line:#263239; --line2:#38464E;
  --accent:#3FA6BE; --accent-ink:#63BDD1; --accent-soft:#0F323C; --on-accent:#08141A;
  --ok:#5CB981; --ok-soft:#142A1E; --warn:#E1766B; --warn-soft:#2E1815;
  --hold:#D7A54A; --hold-soft:#2B2113;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 4px 16px rgba(0,0,0,.5),0 24px 70px rgba(0,0,0,.55);
  --brand-ink:#EDEAE4; --bracket:#2E9EB8;
  --logo-plate:#FFFFFF;}}
:root[data-theme="dark"]{
  --paper:#10191F; --paper2:#0B1319; --surface:#17222A;
  --ink:#EDEAE4; --ink2:#A8B4BC; --ink3:#78868F;
  --line:#263239; --line2:#38464E;
  --accent:#3FA6BE; --accent-ink:#63BDD1; --accent-soft:#0F323C; --on-accent:#08141A;
  --ok:#5CB981; --ok-soft:#142A1E; --warn:#E1766B; --warn-soft:#2E1815;
  --hold:#D7A54A; --hold-soft:#2B2113;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 4px 16px rgba(0,0,0,.5),0 24px 70px rgba(0,0,0,.55);
  --brand-ink:#EDEAE4; --bracket:#2E9EB8;
  --logo-plate:#FFFFFF;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:-.015em;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);
  display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";flex:0 0 40px;height:1px;background:var(--line2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.lede{color:var(--ink2);font-size:14px;margin:0;max-width:62ch}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-ctl);padding:8px 14px;font-size:13px;font-weight:500;
  color:var(--ink);display:inline-flex;align-items:center;gap:7px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-accent:hover{filter:brightness(1.05)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink2)}
.btn-quiet:hover{background:var(--paper2);color:var(--ink);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-lg{padding:11px 18px;font-size:14px}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:0 22px;height:54px}
.brand{display:flex;align-items:center;gap:14px;flex:none;text-decoration:none;color:inherit;background:none;border:0;padding:0}
.lockup{display:inline-flex;align-items:stretch;gap:6px;height:26px}
.lockup svg{width:6.2px;height:26px;display:block;overflow:visible}
.lockup b{align-self:center;font-family:var(--wordmark);font-weight:700;font-size:18.2px;letter-spacing:-.035em;line-height:.95;color:var(--brand-ink)}
.brand small{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);padding-left:12px;border-left:1px solid var(--line);line-height:1.2}
.tabs{display:flex;gap:2px;min-width:0;overflow:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:7px 11px;border-radius:var(--r-ctl);font-size:13px;color:var(--ink2);white-space:nowrap}
.tabs button:hover{background:var(--paper2);color:var(--ink)}
.tabs button.cur{background:var(--paper2);color:var(--ink);font-weight:500}
.tabs button:disabled{opacity:.4;cursor:not-allowed;background:none}
.spacer{flex:1}
.savestate{font-family:var(--mono);font-size:10.5px;color:var(--ink3);display:flex;align-items:center;gap:7px;white-space:nowrap}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.savestate.busy i{background:var(--accent)}
.savestate.err i{background:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:var(--r-ctl);display:inline-flex;
  align-items:center;justify-content:center;color:var(--ink2);flex:none}
.iconbtn:hover{border-color:var(--ink2);color:var(--ink)}
.iconbtn svg{width:15px;height:15px}
@media(max-width:820px){.brand small{display:none}.savestate{display:none}.topbar{gap:10px;padding:0 14px}.jobbar{padding:8px 12px}.jobbar .jtitle b{font-size:16px}}

/* ---------- page shells ---------- */
.page{max-width:1180px;margin:0 auto;padding:36px 28px 80px}
@media(max-width:700px){.page{padding:24px 16px 60px}}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.pagehead h1{font-size:clamp(28px,3.4vw,40px);line-height:1.1;margin:8px 0 8px}
.section{margin-top:52px}
.sechead{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
.sechead h2{font-size:25px}
.sechead::after{content:"";flex:1;height:1px;background:var(--line)}
.sechead .aside{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* ---------- home: the desk ---------- */
.desk{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:44px;align-items:end}
@media(max-width:900px){.desk{grid-template-columns:1fr}}
.desk h1{font-size:clamp(36px,5vw,60px);line-height:1.04;letter-spacing:-.025em;margin:16px 0 18px;text-wrap:pretty}
.desk h1 em{font-style:normal;color:var(--accent-ink)}
.desk .lede{font-size:15.5px;margin-bottom:26px}
.desk .actions{display:flex;gap:10px;flex-wrap:wrap}

.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px 16px}
.ucard .uhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ucard .uhead .eyebrow::after{display:none}
.ubig{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px}
.ubig b{font-family:var(--disp);font-weight:400;font-size:56px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ubig .unit{display:flex;flex-direction:column;line-height:1.25;font-size:12.5px;color:var(--ink2)}
.ubig .unit small{color:var(--ink3);font-family:var(--mono);font-size:10.5px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:100px;
  border:1px solid transparent;white-space:nowrap;display:inline-block;line-height:1.5}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.bad{color:var(--warn);background:var(--warn-soft)}
.chip.ref{color:var(--accent-ink);background:var(--accent-soft)}
.chip.dim{color:var(--ink2);background:var(--paper2)}
.chip.type{color:var(--accent-ink);border-color:var(--accent);background:transparent;text-transform:none;letter-spacing:0;font-size:11px}

/* the signature: a wall drawn to scale */
.lbar{display:flex;height:34px;border-radius:var(--r-input);overflow:hidden;border:1px solid var(--line2);background:var(--paper2)}
.lbar span{display:block;height:100%;transform-origin:left center;animation:drawIn .55s cubic-bezier(.2,.7,.2,1) both;
  animation-delay:calc(var(--i)*70ms);border-right:1px solid rgba(35,30,20,.18)}
.lbar span:last-child{border-right:0}
.lbar span.air{background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(35,30,20,.12) 4px 5px)}
.lbar.sm{height:16px;border-radius:var(--r-input)}
.lkey{font-family:var(--mono);font-size:10.5px;color:var(--ink2);line-height:1.55;margin:9px 0 0}
@keyframes drawIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* jobs list */
.joblist{display:flex;flex-direction:column;gap:8px}
.jobrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:18px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-card);padding:13px 18px;text-align:left;width:100%;color:inherit}
.jobrow:hover{border-color:var(--ink2)}
.jobrow .jn{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink)}
.jobrow .jt{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobrow .jm{display:block;color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobrow .jr{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.jobrow .js{text-align:right;line-height:1.3}
.jobrow .js b{font-weight:500;font-size:12.5px;display:block}
.jobrow .js small{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.jobrow .js.done b{color:var(--ok)}
.jobrow .js.wip b{color:var(--ink2)}
@media(max-width:700px){.jobrow{grid-template-columns:56px minmax(0,1fr);gap:10px}.jobrow .jr{display:none}.jobrow .js{grid-column:1/-1;text-align:left}}
.empty{border:1px dashed var(--line2);border-radius:var(--r-card);padding:26px 24px;color:var(--ink2);font-size:14px;background:transparent}
.empty b{display:block;font-family:var(--disp);font-weight:400;font-size:20px;color:var(--ink);margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;padding:15px 17px 14px;
  border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);color:inherit;min-height:112px}
.tile:hover{border-color:var(--accent)}
.tile .tk{display:flex;justify-content:space-between;width:100%;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3)}
.tile .tk b{color:var(--accent-ink);font-weight:500}
.tile .tn{font-weight:500;font-size:15px;line-height:1.25;margin-top:4px}
.tile .td{font-size:12.5px;color:var(--ink2);line-height:1.4}
.tile.soon{opacity:.5;cursor:not-allowed}
.regflag{margin-top:44px;border:1px solid var(--line);background:var(--warn-soft);border-radius:var(--r-card);padding:15px 18px;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.regflag .chip{flex:none}
.regflag p{margin:0;flex:1;min-width:260px}

/* ---------- chooser modal ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(18,16,12,.5);display:flex;align-items:center;justify-content:center;
  padding:24px;backdrop-filter:blur(3px);animation:fadeIn .18s ease both}
.dialog{background:var(--surface);border-radius:var(--r-modal);max-width:900px;width:100%;max-height:92vh;overflow:auto;
  box-shadow:var(--shadow-lg);padding:32px 36px 30px;position:relative;animation:modalIn .28s cubic-bezier(.2,.7,.2,1) both}
.dialog h1{font-size:30px;margin:6px 0 6px}
.dialog .lede{margin-bottom:22px}
.closeX{position:absolute;top:14px;right:16px;border:0;background:none;font-size:22px;color:var(--ink3);line-height:1;padding:6px 10px;border-radius:var(--r-ctl)}
.closeX:hover{color:var(--ink);background:var(--paper2)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- workspace ---------- */
.jobbar{display:flex;align-items:center;gap:8px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.jobbar .jtitle{display:flex;align-items:baseline;gap:10px;min-width:0}
.jobbar .jtitle b{font-family:var(--disp);font-weight:500;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobbar .jtitle .jsub{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,470px);align-items:start}
@media(max-width:1240px){.wrap{grid-template-columns:250px minmax(0,1fr)}
  .viewer{display:none}body.showprev .viewer{display:block;grid-column:1/-1;border-left:0;border-top:1px solid var(--line);position:static;max-height:none}}

.rail{border-right:1px solid var(--line);background:var(--surface);min-height:calc(100vh - 107px);position:sticky;top:107px;
  max-height:calc(100vh - 107px);overflow:auto;padding:12px 0 24px}
.raillabel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);padding:12px 18px 6px;margin:0}
.rstep{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 14px 7px 16px;
  border-left:2.5px solid transparent;color:var(--ink2)}
.rstep:hover{background:var(--paper2);color:var(--ink)}
.rstep.cur{background:var(--accent-soft);border-left-color:var(--accent);color:var(--ink)}
.rstep .sn{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:none;width:22px;height:22px;border:1px solid var(--line2);
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.rstep.cur .sn{border-color:var(--accent);color:var(--accent-ink)}
.rstep.done .sn{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rstep .st{flex:1;font-size:12.5px;line-height:1.3}
.rstep.cur .st{font-weight:500}
.rstep .sc{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:none}
.rstep .sc.has{color:var(--accent-ink)}
.rstep.fixed .sn{border-style:dashed}
@media(max-width:760px){.wrap{grid-template-columns:1fr}
  .rail{position:static;max-height:none;min-height:0;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:8px 10px;gap:4px;scrollbar-width:none}
  .rail .raillabel{display:none}
  #steps{display:contents}
  .rstep{flex:none;border-left:0;border-radius:var(--r-ctl);padding:7px 10px;width:auto}
  .rstep .st{white-space:nowrap}}

.stage{padding:26px 32px 60px;min-width:0}
.stagehead{margin-bottom:20px}
.crumb{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin:0 0 8px}
.stagehead h2{font-size:30px;line-height:1.15;margin:0 0 8px}
/* the views of one category: its library list, and each calculator it offers. Deliberately not
   the header's filled pills — these sit on a baseline rule with the accent under the current
   one, so the two levels of navigation cannot be mistaken for each other. */
.stagehead.tabbed{margin-bottom:14px}
.stagetabs{display:flex;gap:20px;align-items:flex-end;margin:0 0 16px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
.stagelede{margin:-4px 0 18px}
.stagetabs::-webkit-scrollbar{display:none}
.stab{border:0;background:none;padding:0 0 9px;margin-bottom:-1px;font-size:13.5px;color:var(--ink3);
  white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:baseline;gap:7px}
.stab:hover{color:var(--ink)}
.stab.cur{color:var(--ink);font-weight:500;border-bottom-color:var(--accent)}
.stn{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink3);font-variant-numeric:tabular-nums}
.stab.cur .stn{color:var(--accent-ink)}
.stn.bad,.stab.cur .stn.bad{color:var(--warn)}   /* a failing check names itself on the tab */
.grouplabel{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3);
  margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:14px 16px;margin-bottom:10px}
.card.on{border-color:var(--accent)}
.cardhead{display:flex;align-items:center;gap:11px;cursor:pointer;flex-wrap:wrap}
.cardhead input{accent-color:var(--accent);width:16px;height:16px;flex:none;margin:0}
.tag{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);
  border-radius:var(--r-input);padding:2px 7px;flex:none;letter-spacing:.02em}
.tag.off{visibility:hidden}
.ct{font-weight:500;font-size:14.5px;flex:1;min-width:150px}
.cu{font-family:var(--mono);font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tgt{color:var(--accent-ink);font-weight:500;font-size:12.5px;margin:10px 0 4px}
.text{font-size:13px;color:var(--ink);margin-top:8px}
.text p{margin:0 0 7px;max-width:70ch}
.text p.nt,.paper p.nt{color:var(--ink2);font-size:12px;border-left:2px solid var(--accent);padding-left:10px}
.text.clip{max-height:58px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
.more{background:none;border:0;color:var(--accent-ink);font-size:12px;font-weight:500;padding:3px 0}
.more:hover{text-decoration:underline}
.rm{margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r-ctl);font-size:11px;color:var(--ink2);padding:2px 8px}
.rm:hover{color:var(--warn);border-color:var(--warn)}

/* job record */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
/* min-width:0 twice, and both are load-bearing. A grid item and a flex item both default to
   min-width:auto, so an <input>'s intrinsic width (size=20, about 170px plus padding) sets the
   floor for its column: in a narrow container the second column overflowed and the Practice
   page clipped Named designer and Phone at the card edge. */
.fields label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2);font-weight:500;min-width:0}
.fields label.wide{grid-column:1/-1}
.fields input{border:1px solid var(--line2);background:var(--paper);border-radius:var(--r-input);padding:9px 11px;font-size:14px;color:var(--ink);min-width:0;width:100%}
.fields input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.fields input[type=color]{width:76px;height:38px;padding:3px;cursor:pointer}
.fields small{font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:400;letter-spacing:.02em}
.hist{margin-top:22px}
.hist table{border-collapse:collapse;width:100%;font-size:13px}
.hist td{padding:8px 0;border-bottom:1px solid var(--line)}
.hist td:first-child{font-family:var(--mono);color:var(--accent-ink);width:70px}
